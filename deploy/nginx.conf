# /etc/nginx/sites-available/pattanifc.co
# Deploy: sudo cp deploy/nginx.conf /etc/nginx/sites-available/pattanifc.co \
#      && sudo nginx -t && sudo systemctl reload nginx
#
# Requires SSL cert files at /etc/ssl/pattanifc/ (see setup notes).

limit_req_zone $binary_remote_addr zone=pattani_api_per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pattani_webhook_per_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=pattani_conn_per_ip:10m;

# HTTP → HTTPS redirect (also serves ACME/DCV challenges)
server {
    listen 80;
    listen [::]:80;
    server_name pattanifc.co www.pattanifc.co;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /.well-known/pki-validation/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://pattanifc.co$request_uri;
    }
}

# HTTPS main server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pattanifc.co www.pattanifc.co;

    # setup.sh creates this root-owned marker before stopping application
    # writers. Nginx checks it per request, so every public/API/webhook path is
    # held at 503 throughout migrations and artifact cutover.
    if (-f /var/lib/pattani-fc-maintenance) {
        return 503;
    }

    if ($host != "pattanifc.co") {
        return 301 https://pattanifc.co$request_uri;
    }

    ssl_certificate     /etc/ssl/pattanifc/fullchain.crt;
    ssl_certificate_key /etc/ssl/pattanifc/pattanifc.co.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Safe defaults for all application requests. Large request bodies are
    # accepted only by the explicitly bounded upload locations below.
    client_max_body_size 6m;
    client_body_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_request_buffering on;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    limit_conn pattani_conn_per_ip 40;
    limit_req_status 429;

    # User-uploaded assets: serve directly from disk, bypass Next.js.
    # Next.js locks its public/ file list at build time; runtime uploads
    # never appear via the Node process. nginx reads from disk each request.
    location /uploads/ {
        alias /var/www/pattani-fc/public/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        # add_header directives in a location replace inherited headers, so
        # repeat the security policy here for every uploaded asset response.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; sandbox" always;
        try_files $uri =404;
    }

    # Payload media uploads may contain a video. Nginx allows multipart
    # overhead above Payload's 50 MiB per-file ceiling, but remains bounded.
    location = /payload-api/media {
        client_max_body_size 52m;
        client_body_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        limit_conn pattani_conn_per_ip 4;
        limit_req zone=pattani_api_per_ip burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location ^~ /payload-api/media/ {
        client_max_body_size 52m;
        client_body_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        limit_conn pattani_conn_per_ip 4;
        limit_req zone=pattani_api_per_ip burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # Payload's public first-user endpoint bypasses normal collection access by
    # design. Administrators are bootstrapped locally during deployment, so it
    # must never be reachable from the internet.
    location ^~ /payload-api/cms-users/first-register {
        return 404;
    }

    # All other CMS API requests should remain small and fully buffered before
    # reaching the Node process.
    location ^~ /payload-api/ {
        client_max_body_size 2m;
        limit_req zone=pattani_api_per_ip burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # Payment-provider callbacks need their own quota. Putting them behind the
    # generic API limit can reject a legitimate retry after the customer has
    # already paid.
    location = /api/payments/beam/webhook {
        client_max_body_size 64k;
        client_body_timeout 15s;
        proxy_read_timeout 30s;
        limit_req zone=pattani_webhook_per_ip burst=90 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/payments/xendit/webhook {
        client_max_body_size 64k;
        client_body_timeout 15s;
        proxy_read_timeout 30s;
        limit_req zone=pattani_webhook_per_ip burst=90 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # Barcode access uses a short-lived capability in the request URL. Never
    # persist that capability/pass code in nginx access logs.
    location ^~ /api/season-passes/ {
        access_log off;
        client_max_body_size 64k;
        limit_req zone=pattani_api_per_ip burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # Other public/admin JSON APIs do not accept file uploads.
    location ^~ /api/ {
        client_max_body_size 1m;
        limit_req zone=pattani_api_per_ip burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
